<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Kursi Pertemuan - Display HDMI</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 5px 0 15px 0;
        }
        h1 { margin: 0; font-size: 1.6rem; letter-spacing: 1px; color: #38bdf8; text-align: center; }
        
        /* Power Button Style */
        .power-btn {
            background-color: #2e7d32; /* Hijau saat aktif */
            color: white;
            border: 2px solid #81c784;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(46, 125, 50, 0.6);
            transition: all 0.3s ease;
        }
        .power-btn.stopped {
            background-color: #c62828; /* Merah saat dihentikan */
            border-color: #e57373;
            box-shadow: 0 0 10px rgba(198, 40, 40, 0.6);
        }
        .power-btn:hover {
            transform: scale(1.1);
        }

        .table-container { width: 100%; max-width: 95%; margin: 0 auto 20px auto; }
        .summary-table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        .summary-table th, .summary-table td { padding: 8px 12px; text-align: center; border-bottom: 1px solid #333; }
        .summary-table th { background-color: #2c2c2c; color: #ffca28; font-size: 0.95rem; }
        .summary-table td { font-size: 0.9rem; }
        .summary-table tfoot tr { background-color: #252525; font-weight: bold; font-size: 0.95rem; }
        .text-kosong { color: #81c784; font-weight: bold; }
        .text-terisi { color: #e57373; font-weight: bold; }

        .block-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            align-items: flex-start;
            width: 100%;
        }

        .block-card { 
            background: #1e1e1e; 
            padding: 10px 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            flex: 1 1 auto;
            max-width: 100%;
            box-sizing: border-box;
        }
        .block-card h3 { margin: 0 0 8px 0; border-bottom: 1px solid #444; padding-bottom: 5px; text-align: center; color: #ffca28; font-size: 1rem; }
        
        .grid { display: grid; gap: 4px; margin-top: 5px; width: 100%; }
        .seat { 
            height: 26px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 3px; 
            font-weight: bold; 
            padding: 0 1px; 
            white-space: nowrap;
            overflow: hidden;
        }
        .vacant { background-color: #2e7d32; color: white; }
        .occupied { background-color: #c62828; color: white; }

        /* KEYPAD PIN MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-overlay.active { display: flex; }
        .pin-modal {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            width: 290px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }
        .pin-modal h3 { margin: 0 0 10px 0; color: #ffca28; font-size: 1.1rem; }
        .pin-display {
            background: #121212;
            border: 1px solid #444;
            border-radius: 6px;
            height: 45px;
            font-size: 1.6rem;
            letter-spacing: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: #38bdf8;
            font-weight: bold;
        }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .keypad-btn {
            background: #2c2c2c;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .keypad-btn:active { background: #444; }
        .keypad-btn.action-btn { background: #0284c7; color: white; }
        .keypad-btn.clear-btn { background: #b91c1c; color: white; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .btn-cancel { background: #4b5563; color: white; }
        .btn-submit { background: #16a34a; color: white; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>MONITORING KURSI PERTEMUAN</h1>
        <button id="powerBtn" class="power-btn" title="Monitoring Aktif (Klik untuk Hentikan)" onclick="openPinModal()">⏻</button>
    </div>

    <div class="table-container">
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Blok</th>
                    <th>Jumlah Kursi</th>
                    <th>Terisi</th>
                    <th>Kursi Kosong</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4">Menghubungkan ke server...</td></tr>
            </tbody>
            <tfoot id="tableFoot"></tfoot>
        </table>
    </div>

    <div class="block-container" id="blocksWrapper"></div>

    <!-- KEYPAD PIN MODAL -->
    <div class="modal-overlay" id="pinModal">
        <div class="pin-modal">
            <h3 id="pinModalTitle">MASUKKAN PIN</h3>
            <div class="pin-display" id="pinDisplay"></div>
            <div class="keypad-grid">
                <button class="keypad-btn" onclick="pressKey('1')">1</button>
                <button class="keypad-btn" onclick="pressKey('2')">2</button>
                <button class="keypad-btn" onclick="pressKey('3')">3</button>
                <button class="keypad-btn" onclick="pressKey('4')">4</button>
                <button class="keypad-btn" onclick="pressKey('5')">5</button>
                <button class="keypad-btn" onclick="pressKey('6')">6</button>
                <button class="keypad-btn" onclick="pressKey('7')">7</button>
                <button class="keypad-btn" onclick="pressKey('8')">8</button>
                <button class="keypad-btn" onclick="pressKey('9')">9</button>
                <button class="keypad-btn clear-btn" onclick="pressKey('C')">C</button>
                <button class="keypad-btn" onclick="pressKey('0')">0</button>
                <button class="keypad-btn action-btn" onclick="pressKey('DEL')">⌫</button>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closePinModal()">Batal</button>
                <button class="btn-submit" onclick="submitPin()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://monitoring-tatib-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('seminar_seats');

        let isMonitoringActive = true;
        let pinBuffer = "";

        // Mulai mendengarkan data realtime
        function startMonitoring() {
            db.on('value', handleSnapshot, (error) => {
                console.error("Gagal mengambil data:", error);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="color:red">Error: ${error.message}</td></tr>`;
            });
        }

        // Hentikan penanganan snapshot realtime
        function stopMonitoring() {
            db.off('value', handleSnapshot);
        }

        function handleSnapshot(snapshot) {
            const data = snapshot.val();
            renderDisplay(data);
        }

        // Inisialisasi awal
        startMonitoring();

        function renderDisplay(rawData) {
            const tbody = document.getElementById('tableBody');
            const tfoot = document.getElementById('tableFoot');
            const wrapper = document.getElementById('blocksWrapper');

            tbody.innerHTML = '';
            tfoot.innerHTML = '';
            wrapper.innerHTML = '';

            const otherAttendees = (rawData && rawData.otherAttendees !== undefined) ? parseInt(rawData.otherAttendees) : 0;

            if (!rawData || (!rawData.blocks && otherAttendees === 0)) {
                tbody.innerHTML = '<tr><td colspan="4">Belum ada data ditambahkan dari Panel Tatib.</td></tr>';
                return;
            }

            const blocks = rawData.blocks 
                ? (Array.isArray(rawData.blocks) ? rawData.blocks : Object.values(rawData.blocks))
                : [];

            let grandTotalKursi = 0;
            let grandTotalTerisi = 0;
            let grandTotalKosong = 0;

            blocks.forEach(block => {
                if (!block) return;

                const seats = block.seats 
                    ? (Array.isArray(block.seats) ? block.seats : Object.values(block.seats))
                    : [];

                const validSeats = seats.filter(s => s && s.isSeat !== false);
                const jumlahKursi = validSeats.length;
                const terisi = validSeats.filter(s => s.occupied).length;
                const kosong = jumlahKursi - terisi;

                grandTotalKursi += jumlahKursi;
                grandTotalTerisi += terisi;
                grandTotalKosong += kosong;

                const statusIcon = block.isLocked ? '✅' : '✏️';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>Blok ${block.code}</b> ${statusIcon}</td>
                    <td>${jumlahKursi}</td>
                    <td class="text-terisi">${terisi}</td>
                    <td class="text-kosong">${kosong}</td>
                `;
                tbody.appendChild(tr);

                const card = document.createElement('div');
                card.className = 'block-card';

                const cols = parseInt(block.cols) || 1;
                const minWidth = Math.max(200, cols * 28 + 24); 
                card.style.minWidth = `${minWidth}px`;

                card.innerHTML = `<h3>BLOK ${block.code} ${statusIcon}</h3>`;

                const grid = document.createElement('div');
                grid.className = 'grid';
                grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

                let fontSize = '0.7rem';
                if (cols >= 10) fontSize = '0.55rem';
                else if (cols >= 7) fontSize = '0.62rem';

                seats.forEach(seat => {
                    if (!seat) return;

                    if (seat.isSeat === false) {
                        const emptyEl = document.createElement('div');
                        emptyEl.style.height = '26px';
                        emptyEl.style.visibility = 'hidden';
                        grid.appendChild(emptyEl);
                        return;
                    }

                    const seatEl = document.createElement('div');
                    seatEl.className = `seat ${seat.occupied ? 'occupied' : 'vacant'}`;
                    seatEl.style.fontSize = fontSize;
                    seatEl.innerText = `${seat.r},${seat.c}`;
                    grid.appendChild(seatEl);
                });

                card.appendChild(grid);
                wrapper.appendChild(card);
            });

            const trOther = document.createElement('tr');
            trOther.innerHTML = `
                <td><b>Hadirin Lain</b></td>
                <td>-</td>
                <td class="text-terisi">${otherAttendees}</td>
                <td>-</td>
            `;
            tbody.appendChild(trOther);

            const totalHadirin = grandTotalTerisi + otherAttendees;

            tfoot.innerHTML = `
                <tr>
                    <td>TOTAL HADIRIN</td>
                    <td>${grandTotalKursi}</td>
                    <td class="text-terisi">${totalHadirin}</td>
                    <td class="text-kosong">${grandTotalKosong}</td>
                </tr>
            `;
        }

        /* --- FUNGSI KEYPAD PIN & POWER BUTTON --- */
        function openPinModal() {
            pinBuffer = "";
            updatePinDisplay();
            document.getElementById('pinModalTitle').innerText = isMonitoringActive 
                ? "PIN HENTIKAN MONITORING" 
                : "PIN RESET & AKTIFKAN";
            document.getElementById('pinModal').classList.add('active');
        }

        function closePinModal() {
            pinBuffer = "";
            document.getElementById('pinModal').classList.remove('active');
        }

        function pressKey(key) {
            if (key === 'C') {
                pinBuffer = "";
            } else if (key === 'DEL') {
                pinBuffer = pinBuffer.slice(0, -1);
            } else if (pinBuffer.length < 8) {
                pinBuffer += key;
            }
            updatePinDisplay();
        }

        function updatePinDisplay() {
            document.getElementById('pinDisplay').innerText = '•'.repeat(pinBuffer.length);
        }

        // Verifikasi PIN dari Node Firebase `SANDI_TAMBAH_HAPUS`
        async function verifyPin(enteredPin) {
            try {
                // Cek node root / SANDI_TAMBAH_HAPUS atau seminar_seats/SANDI_TAMBAH_HAPUS
                let snap = await firebase.database().ref('SANDI_TAMBAH_HAPUS').once('value');
                let validPin = snap.val();
                
                if (!validPin) {
                    snap = await firebase.database().ref('seminar_seats/SANDI_TAMBAH_HAPUS').once('value');
                    validPin = snap.val();
                }

                // Default PIN cadangan jika belum disetting di database
                if (!validPin) validPin = "1234";

                return String(enteredPin) === String(validPin);
            } catch (err) {
                console.error("Gagal memverifikasi PIN:", err);
                return false;
            }
        }

        async function submitPin() {
            if (!pinBuffer) {
                alert("Masukkan PIN terlebih dahulu!");
                return;
            }

            const isValid = await verifyPin(pinBuffer);
            if (isValid) {
                closePinModal();
                togglePowerState();
            } else {
                alert("PIN Salah! Akses ditolak.");
                pinBuffer = "";
                updatePinDisplay();
            }
        }

        // Toggle Status Monitoring
        async function togglePowerState() {
            const powerBtn = document.getElementById('powerBtn');

            if (isMonitoringActive) {
                // HENTIKAN MONITORING (Ubah ke Merah)
                isMonitoringActive = false;
                powerBtn.classList.add('stopped');
                powerBtn.title = "Monitoring Dihentikan (Klik untuk Reset & Aktifkan)";
                stopMonitoring();
                alert("Penghitungan/monitoring hadirin berhasil dihentikan.");
            } else {
                // RESET DATA & AKTIFKAN MONITORING (Ubah ke Hijau)
                await resetAllSeatsData();
                isMonitoringActive = true;
                powerBtn.classList.remove('stopped');
                powerBtn.title = "Monitoring Aktif (Klik untuk Hentikan)";
                startMonitoring();
                alert("Semua data kursi dan hadirin berhasil di-reset. Kembali ke mode pengisian.");
            }
        }

        // Reset Data Kursi dan Hadirin Lain di Firebase
        async function resetAllSeatsData() {
            try {
                const snap = await db.once('value');
                const data = snap.val();
                if (!data) return;

                let updates = {};
                updates['otherAttendees'] = 0;

                if (data.blocks) {
                    const blocks = Array.isArray(data.blocks) ? data.blocks : Object.values(data.blocks);
                    blocks.forEach((block, bIdx) => {
                        if (!block || !block.seats) return;
                        const seats = Array.isArray(block.seats) ? block.seats : Object.values(block.seats);
                        seats.forEach((seat, sIdx) => {
                            if (seat && seat.isSeat !== false) {
                                updates[`blocks/${bIdx}/seats/${sIdx}/occupied`] = false;
                            }
                        });
                    });
                }

                await db.update(updates);
            } catch (err) {
                console.error("Gagal melakukan reset data:", err);
                alert("Terjadi kesalahan saat mengosongkan data kursi.");
            }
        }

        // Dukungan Tombol Keyboard Fisik untuk Keypad Modal
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('pinModal');
            if (!modal.classList.contains('active')) return;

            if (e.key >= '0' && e.key <= '9') {
                pressKey(e.key);
            } else if (e.key === 'Backspace') {
                pressKey('DEL');
            } else if (e.key === 'Escape') {
                closePinModal();
            } else if (e.key === 'Enter') {
                submitPin();
            }
        });
    </script>
</body>
</html>
