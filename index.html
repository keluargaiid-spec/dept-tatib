<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Tatib Kursi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
        .nav-buttons { display: flex; flex-direction: column; gap: 16px; }
        .btn-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .btn-card:hover {
            border-color: #38bdf8;
            background: #1e293b;
            transform: translateY(-2px);
        }
        .btn-card span.icon { font-size: 24px; }
        .btn-card .desc { font-size: 12px; color: #64748b; font-weight: normal; text-align: left; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PANEL TATIB MONITORING</h1>
        <p>Sistem Pengawasan & Management Kursi Pertemuan Real-Time</p>

        <div class="nav-buttons">
            <a href="operator.html" class="btn-card">
                <div style="text-align: left;">
                    <div>Panel Operator / Tatib</div>
                    <div class="desc">Input kehadiran, buat blok, dan kelola kursi</div>
                </div>
                <span class="icon">📱</span>
            </a>

            <a href="display.html" class="btn-card">
                <div style="text-align: left;">
                    <div>Layar Display HDMI</div>
                    <div class="desc">Tampilan penuh untuk Layar TV / Proyektor</div>
                </div>
                <span class="icon">🖥️</span>
            </a>
        </div>
    </div>
</body>
</html>
