<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Kursi Pertemuan - Display HDMI</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        h1 { text-align: center; margin: 5px 0 15px 0; font-size: 1.6rem; letter-spacing: 1px; }
        
        .table-container { width: 100%; max-width: 95%; margin: 0 auto 20px auto; }
        .summary-table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        .summary-table th, .summary-table td { padding: 8px 12px; text-align: center; border-bottom: 1px solid #333; }
        .summary-table th { background-color: #2c2c2c; color: #ffca28; font-size: 0.95rem; }
        .summary-table td { font-size: 0.9rem; }
        .summary-table tfoot tr { background-color: #252525; font-weight: bold; font-size: 0.95rem; }
        .text-kosong { color: #81c784; font-weight: bold; }
        .text-terisi { color: #e57373; font-weight: bold; }

        /* Container blok agar bisa berjajar fleksibel ke samping */
        .block-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            align-items: flex-start;
            width: 100%;
        }

        /* Card Blok Ringkas */
        .block-card { 
            background: #1e1e1e; 
            padding: 10px 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            flex: 1 1 200px; /* Otomatis melebar & berjajar */
            max-width: 400px;
            min-width: 180px;
        }
        .block-card h3 { margin: 0 0 8px 0; border-bottom: 1px solid #444; padding-bottom: 5px; text-align: center; color: #ffca28; font-size: 1rem; }
        
        /* Grid Kursi Ringkas */
        .grid { display: grid; gap: 4px; margin-top: 5px; }
        .seat { 
            height: 26px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 3px; 
            font-weight: bold; 
            font-size: 0.7rem; 
            padding: 0 2px; 
        }
        .vacant { background-color: #2e7d32; color: white; }
        .occupied { background-color: #c62828; color: white; }
    </style>
</head>
<body>

    <h1>MONITORING KURSI PERTEMUAN</h1>

    <div class="table-container">
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Blok</th>
                    <th>Jumlah Kursi</th>
                    <th>Kosong</th>
                    <th>Terisi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4">Menghubungkan ke server...</td></tr>
            </tbody>
            <tfoot id="tableFoot"></tfoot>
        </table>
    </div>

    <div class="block-container" id="blocksWrapper"></div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://monitoring-tatib-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('seminar_seats');

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            renderDisplay(data);
        }, (error) => {
            console.error("Gagal mengambil data:", error);
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="color:red">Error: ${error.message}</td></tr>`;
        });

        function renderDisplay(rawData) {
            const tbody = document.getElementById('tableBody');
            const tfoot = document.getElementById('tableFoot');
            const wrapper = document.getElementById('blocksWrapper');

            tbody.innerHTML = '';
            tfoot.innerHTML = '';
            wrapper.innerHTML = '';

            if (!rawData || !rawData.blocks) {
                tbody.innerHTML = '<tr><td colspan="4">Belum ada blok ditambahkan dari Panel Tatib.</td></tr>';
                return;
            }

            const blocks = Array.isArray(rawData.blocks) 
                ? rawData.blocks 
                : Object.values(rawData.blocks);

            let grandTotalKursi = 0, grandTotalKosong = 0, grandTotalTerisi = 0;

            blocks.forEach(block => {
                if (!block) return;

                const seats = block.seats 
                    ? (Array.isArray(block.seats) ? block.seats : Object.values(block.seats))
                    : [];

                const totalKursi = seats.length;
                const terisi = seats.filter(s => s && s.occupied).length;
                const kosong = totalKursi - terisi;

                grandTotalKursi += totalKursi;
                grandTotalKosong += kosong;
                grandTotalTerisi += terisi;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>Blok ${block.code}</b></td>
                    <td>${totalKursi}</td>
                    <td class="text-kosong">${kosong}</td>
                    <td class="text-terisi">${terisi}</td>
                `;
                tbody.appendChild(tr);

                const card = document.createElement('div');
                card.className = 'block-card';
                card.innerHTML = `<h3>BLOK ${block.code}</h3>`;

                const grid = document.createElement('div');
                grid.className = 'grid';
                grid.style.gridTemplateColumns = `repeat(${block.cols}, 1fr)`;

                seats.forEach(seat => {
                    if (!seat) return;
                    const seatEl = document.createElement('div');
                    seatEl.className = `seat ${seat.occupied ? 'occupied' : 'vacant'}`;
                    
                    // Format baru ringkas: Baris,Kolom (contoh: 1,6)
                    seatEl.innerText = `${seat.r},${seat.c}`;
                    grid.appendChild(seatEl);
                });

                card.appendChild(grid);
                wrapper.appendChild(card);
            });

            tfoot.innerHTML = `
                <tr>
                    <td>TOTAL</td>
                    <td>${grandTotalKursi}</td>
                    <td class="text-kosong">${grandTotalKosong}</td>
                    <td class="text-terisi">${grandTotalTerisi}</td>
                </tr>
            `;
        }
    </script>
</body>
</html>
