<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Kursi Pertemuan - Display HDMI</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        
        /* Header & Power Button Layout */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 5px 0 15px 0;
        }
        h1 { margin: 0; font-size: 1.6rem; letter-spacing: 1px; color: #38bdf8; text-align: center; }
        
        /* Tombol Power Styling */
        .btn-power {
            background: transparent;
            border: 2px solid;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            outline: none;
        }
        .btn-power svg { width: 22px; height: 22px; fill: currentColor; }
        
        /* Status Power ON (Hijau) */
        .btn-power.on {
            color: #22c55e;
            border-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        }
        .btn-power.on:hover { background: rgba(34, 197, 94, 0.15); }

        /* Status Power OFF (Merah) */
        .btn-power.off {
            color: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }
        .btn-power.off:hover { background: rgba(239, 68, 68, 0.15); }

        /* Overlay & Keypad PIN Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .pin-modal {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            width: 280px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .pin-modal h3 { margin: 0 0 10px 0; color: #ffca28; font-size: 1.1rem; }
        .pin-display {
            width: 100%;
            height: 40px;
            background: #121212;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 15px;
            line-height: 40px;
        }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .key-btn {
            background: #2c2c2c;
            color: white;
            border: 1px solid #444;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .key-btn:active { background: #444; }
        .key-btn.clear { background: #991b1b; }
        .key-btn.enter { background: #15803d; }
        .pin-error { color: #ef4444; font-size: 0.8rem; margin-top: 8px; min-height: 18px; }

        /* Disable Container saat System Matikan */
        .system-disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(80%);
        }

        /* Styling Tabel & Blok */
        .table-container { width: 100%; max-width: 95%; margin: 0 auto 20px auto; }
        .summary-table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        .summary-table th, .summary-table td { padding: 8px 12px; text-align: center; border-bottom: 1px solid #333; }
        .summary-table th { background-color: #2c2c2c; color: #ffca28; font-size: 0.95rem; }
        .summary-table td { font-size: 0.9rem; }
        .summary-table tfoot tr { background-color: #252525; font-weight: bold; font-size: 0.95rem; }
        .text-kosong { color: #81c784; font-weight: bold; }
        .text-terisi { color: #e57373; font-weight: bold; }

        .block-container { 
            display: flex; flex-wrap: wrap; gap: 15px; 
            justify-content: center; align-items: flex-start; width: 100%; 
        }
        .block-card { 
            background: #1e1e1e; padding: 10px 12px; border-radius: 8px; 
            border: 1px solid #333; flex: 1 1 auto; max-width: 100%; box-sizing: border-box; 
        }
        .block-card h3 { margin: 0 0 8px 0; border-bottom: 1px solid #444; padding-bottom: 5px; text-align: center; color: #ffca28; font-size: 1rem; }
        
        .grid { display: grid; gap: 4px; margin-top: 5px; width: 100%; }
        .seat { 
            height: 26px; display: flex; align-items: center; justify-content: center; 
            border-radius: 3px; font-weight: bold; padding: 0 1px; white-space: nowrap; overflow: hidden; 
        }
        .vacant { background-color: #2e7d32; color: white; }
        .occupied { background-color: #c62828; color: white; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>MONITORING KURSI PERTEMUAN</h1>
        <!-- Tombol Power Icon -->
        <button id="btnPower" class="btn-power on" title="Power System" onclick="promptPowerPIN()">
            <svg viewBox="0 0 24 24">
                <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
            </svg>
        </button>
    </div>

    <div id="mainContent">
        <div class="table-container">
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>Blok</th>
                        <th>Jumlah Kursi</th>
                        <th>Terisi</th>
                        <th>Kursi Kosong</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4">Menghubungkan ke server...</td></tr>
                </tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>

        <div class="block-container" id="blocksWrapper"></div>
    </div>

    <!-- Modal Keypad PIN -->
    <div class="modal-overlay" id="pinModal">
        <div class="pin-modal">
            <h3>MASUKKAN PIN</h3>
            <div class="pin-display" id="pinDisplay"></div>
            <div class="keypad">
                <button class="key-btn" onclick="pressPin('1')">1</button>
                <button class="key-btn" onclick="pressPin('2')">2</button>
                <button class="key-btn" onclick="pressPin('3')">3</button>
                <button class="key-btn" onclick="pressPin('4')">4</button>
                <button class="key-btn" onclick="pressPin('5')">5</button>
                <button class="key-btn" onclick="pressPin('6')">6</button>
                <button class="key-btn" onclick="pressPin('7')">7</button>
                <button class="key-btn" onclick="pressPin('8')">8</button>
                <button class="key-btn" onclick="pressPin('9')">9</button>
                <button class="key-btn clear" onclick="clearPin()">C</button>
                <button class="key-btn" onclick="pressPin('0')">0</button>
                <button class="key-btn enter" onclick="submitPin()">OK</button>
            </div>
            <div class="pin-error" id="pinError"></div>
            <button style="margin-top: 10px; background: transparent; border: none; color: #888; cursor: pointer;" onclick="closePinModal()">Batal</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://monitoring-tatib-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('seminar_seats');

        // Sandi sesuai instruksi
        const SANDI_TAMBAH_HAPUS = "1234"; // Ubah sesuai PIN Anda

        let currentInputPin = "";
        let isSystemActive = true;
        let globalRawData = null;

        // Mendengarkan perubahan Firebase
        db.on('value', (snapshot) => {
            globalRawData = snapshot.val();
            
            // Baca status sistem (default true jika belum ada)
            isSystemActive = globalRawData && globalRawData.systemActive !== undefined ? globalRawData.systemActive : true;
            
            updatePowerButtonUI(isSystemActive);
            renderDisplay(globalRawData);
        }, (error) => {
            console.error("Gagal mengambil data:", error);
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" style="color:red">Error: ${error.message}</td></tr>`;
        });

        function updatePowerButtonUI(active) {
            const btn = document.getElementById('btnPower');
            const mainContent = document.getElementById('mainContent');

            if (active) {
                btn.className = "btn-power on";
                mainContent.classList.remove("system-disabled");
            } else {
                btn.className = "btn-power off";
                mainContent.classList.add("system-disabled");
            }
        }

        /* --- KONTROL PIN KEYPAD --- */
        function promptPowerPIN() {
            currentInputPin = "";
            document.getElementById('pinDisplay').innerText = "";
            document.getElementById('pinError').innerText = "";
            document.getElementById('pinModal').classList.add('active');
        }

        function closePinModal() {
            document.getElementById('pinModal').classList.remove('active');
        }

        function pressPin(num) {
            if (currentInputPin.length < 6) {
                currentInputPin += num;
                document.getElementById('pinDisplay').innerText = "*".repeat(currentInputPin.length);
            }
        }

        function clearPin() {
            currentInputPin = "";
            document.getElementById('pinDisplay').innerText = "";
            document.getElementById('pinError').innerText = "";
        }

        function submitPin() {
            if (currentInputPin === SANDI_TAMBAH_HAPUS) {
                closePinModal();
                togglePowerState();
            } else {
                document.getElementById('pinError').innerText = "PIN Salah!";
                clearPin();
            }
        }

        /* --- TOGGLE POWER SYSTEM & RESET DATA --- */
        function togglePowerState() {
            const nextActiveState = !isSystemActive;

            if (!nextActiveState) {
                // DIUBAH MENJADI OFF (MERAH) -> Hentikan Penghitungan / Lock
                db.update({ systemActive: false });
            } else {
                // DIUBAH MENJADI ON (HIJAU) -> Reset semua data kursi & hadirin lain
                let updates = {};
                updates['systemActive'] = true;
                updates['otherAttendees'] = 0;

                if (globalRawData && globalRawData.blocks) {
                    const blocks = Array.isArray(globalRawData.blocks) ? globalRawData.blocks : Object.values(globalRawData.blocks);
                    
                    blocks.forEach((block, bIdx) => {
                        if (block && block.seats) {
                            const seats = Array.isArray(block.seats) ? block.seats : Object.values(block.seats);
                            seats.forEach((seat, sIdx) => {
                                if (seat && seat.isSeat !== false) {
                                    updates[`blocks/${bIdx}/seats/${sIdx}/occupied`] = false;
                                }
                            });
                        }
                    });
                }

                // Kirim reset data ke Firebase
                db.update(updates).then(() => {
                    alert("Sistem Diaktifkan Kembali! Semua data kursi telah di-reset.");
                });
            }
        }

        function renderDisplay(rawData) {
            const tbody = document.getElementById('tableBody');
            const tfoot = document.getElementById('tableFoot');
            const wrapper = document.getElementById('blocksWrapper');

            tbody.innerHTML = '';
            tfoot.innerHTML = '';
            wrapper.innerHTML = '';

            const otherAttendees = (rawData && rawData.otherAttendees !== undefined) ? parseInt(rawData.otherAttendees) : 0;

            if (!rawData || (!rawData.blocks && otherAttendees === 0)) {
                tbody.innerHTML = '<tr><td colspan="4">Belum ada data ditambahkan dari Panel Tatib.</td></tr>';
                return;
            }

            const blocks = rawData.blocks 
                ? (Array.isArray(rawData.blocks) ? rawData.blocks : Object.values(rawData.blocks))
                : [];

            let grandTotalKursi = 0;
            let grandTotalTerisi = 0;
            let grandTotalKosong = 0;

            blocks.forEach(block => {
                if (!block) return;

                const seats = block.seats 
                    ? (Array.isArray(block.seats) ? block.seats : Object.values(block.seats))
                    : [];

                const validSeats = seats.filter(s => s && s.isSeat !== false);
                const jumlahKursi = validSeats.length;
                const terisi = validSeats.filter(s => s.occupied).length;
                const kosong = jumlahKursi - terisi;

                grandTotalKursi += jumlahKursi;
                grandTotalTerisi += terisi;
                grandTotalKosong += kosong;

                const statusIcon = block.isLocked ? '✅' : '✏️';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>Blok ${block.code}</b> ${statusIcon}</td>
                    <td>${jumlahKursi}</td>
                    <td class="text-terisi">${terisi}</td>
                    <td class="text-kosong">${kosong}</td>
                `;
                tbody.appendChild(tr);

                const card = document.createElement('div');
                card.className = 'block-card';

                const cols = parseInt(block.cols) || 1;
                const minWidth = Math.max(200, cols * 28 + 24); 
                card.style.minWidth = `${minWidth}px`;

                card.innerHTML = `<h3>BLOK ${block.code} ${statusIcon}</h3>`;

                const grid = document.createElement('div');
                grid.className = 'grid';
                grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

                let fontSize = '0.7rem';
                if (cols >= 10) {
                    fontSize = '0.55rem';
                } else if (cols >= 7) {
                    fontSize = '0.62rem';
                }

                seats.forEach(seat => {
                    if (!seat) return;

                    if (seat.isSeat === false) {
                        const emptyEl = document.createElement('div');
                        emptyEl.style.height = '26px';
                        emptyEl.style.visibility = 'hidden';
                        grid.appendChild(emptyEl);
                        return;
                    }

                    const seatEl = document.createElement('div');
                    seatEl.className = `seat ${seat.occupied ? 'occupied' : 'vacant'}`;
                    seatEl.style.fontSize = fontSize;
                    seatEl.innerText = `${seat.r},${seat.c}`;
                    grid.appendChild(seatEl);
                });

                card.appendChild(grid);
                wrapper.appendChild(card);
            });

            const trOther = document.createElement('tr');
            trOther.innerHTML = `
                <td><b>Hadirin Lain</b></td>
                <td>-</td>
                <td class="text-terisi">${otherAttendees}</td>
                <td>-</td>
            `;
            tbody.appendChild(trOther);

            const totalHadirin = grandTotalTerisi + otherAttendees;

            tfoot.innerHTML = `
                <tr>
                    <td>TOTAL HADIRIN</td>
                    <td>${grandTotalKursi}</td>
                    <td class="text-terisi">${totalHadirin}</td>
                    <td class="text-kosong">${grandTotalKosong}</td>
                </tr>
            `;
        }
    </script>
</body>
</html>
